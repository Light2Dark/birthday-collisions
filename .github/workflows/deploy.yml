# Build and deploy the marimo notebook to GitHub Pages.
# https://docs.marimo.io/guides/publishing/github/#publish-using-github-actions

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Export notebook to html-wasm
        run: |
          uvx --from 'marimo>=0.23.16' marimo export html-wasm custom.py \
            -o _site \
            --mode run \
            --show-code \
            --sandbox \
            -f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
